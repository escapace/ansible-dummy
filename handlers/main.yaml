---
- name: dummy gather service facts before runtime effects
  ansible.builtin.service_facts:
  listen:
    - dummy reconfigure systemd-networkd
    - dummy restart ferm

- name: dummy reconfigure active systemd-networkd
  ansible.builtin.command:
    argv:
      - /usr/bin/networkctl
      - reconfigure
      - "dummy{{ item }}"
  loop: "{{ range(0, dummy_number) | list }}"
  changed_when: true
  when: >-
    (ansible_facts.services | default({}))
    .get("systemd-networkd.service", {})
    .get("state") == "running"
  listen: dummy reconfigure systemd-networkd

- name: dummy restart active ferm
  ansible.builtin.systemd_service:
    name: ferm.service
    state: restarted
  when: >-
    (ansible_facts.services | default({}))
    .get("ferm.service", {})
    .get("state") == "running"
  listen: dummy restart ferm
