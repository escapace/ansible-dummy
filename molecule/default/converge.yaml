---
- name: converge
  hosts: all
  vars:
    dummy_role_debug: true
  pre_tasks:
    - name: create optional ferm integration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/ferm/ferm.d
        - /etc/ferm/vars.d
  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
