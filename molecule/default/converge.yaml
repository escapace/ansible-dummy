---
- name: converge
  hosts: all
  pre_tasks:
    - name: enable epel for role prerequisites
      ansible.builtin.package:
        name: epel-release
        state: present

    - name: install role prerequisites
      ansible.builtin.package:
        name: systemd-networkd
        state: present

    - name: create optional ferm integration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/ferm/ferm.d
        - /etc/ferm/vars.d
  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
