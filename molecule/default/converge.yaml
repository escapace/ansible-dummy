---
- name: converge
  hosts: all
  pre_tasks:
    - name: enable epel for role prerequisites
      ansible.builtin.package:
        name: epel-release
        state: present

    - name: install role prerequisites
      ansible.builtin.package:
        name:
          - systemd-networkd
          - firewalld
        state: present

    - name: create optional firewalld policy directory
      ansible.builtin.file:
        path: /etc/firewalld/policies
        state: directory
        mode: "0755"
  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
