---
- name: gather package state
  ansible.builtin.package_facts:
    manager: auto

- name: require systemd-networkd package
  ansible.builtin.assert:
    that:
      - "'systemd-networkd' in ansible_facts.get('packages', {})"
    fail_msg: >-
      ansible-dummy requires the systemd-networkd package on the managed host.
    quiet: true

- name: create systemd-networkd configuration directory
  ansible.builtin.file:
    path: /etc/systemd/network
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: check for ferm rule configuration directory
  ansible.builtin.stat:
    path: /etc/ferm/ferm.d
  register: dummy_ferm_rule_directory

- name: check for ferm variable configuration directory
  ansible.builtin.stat:
    path: /etc/ferm/vars.d
  register: dummy_ferm_variable_directory

- name: configure each dummy interface
  ansible.builtin.include_tasks: network.yaml
  loop: "{{ range(0, dummy_number) | list }}"
  loop_control:
    loop_var: dummy_index
