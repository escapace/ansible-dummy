---
- name: configure netdev for dummy{{ dummy_index }}
  ansible.builtin.template:
    src: dummy.netdev.j2
    dest: "/etc/systemd/network/80-dummy{{ dummy_index }}.netdev"
    owner: root
    group: root
    mode: "0644"
  notify: dummy reload systemd-networkd

- name: configure network for dummy{{ dummy_index }}
  ansible.builtin.template:
    src: dummy.network.j2
    dest: "/etc/systemd/network/80-dummy{{ dummy_index }}.network"
    owner: root
    group: root
    mode: "0644"
  notify: dummy reload systemd-networkd
