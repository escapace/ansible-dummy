---
- name: configure netdev for dummy{{ dummy_index }}
  ansible.builtin.template:
    src: dummy.netdev.j2
    dest: "/etc/systemd/network/80-dummy{{ dummy_index }}.netdev"
    owner: root
    group: root
    mode: "0644"
  notify:
    - dummy reconfigure systemd-networkd

- name: configure network for dummy{{ dummy_index }}
  ansible.builtin.template:
    src: dummy.network.j2
    dest: "/etc/systemd/network/80-dummy{{ dummy_index }}.network"
    owner: root
    group: root
    mode: "0644"
  notify:
    - dummy reconfigure systemd-networkd

- name: configure ferm variables for dummy{{ dummy_index }}
  ansible.builtin.template:
    src: ferm-vars.j2
    dest: "/etc/ferm/vars.d/1000-dummy{{ dummy_index }}.conf"
    owner: root
    group: root
    mode: "0600"
  when:
    - dummy_ferm_rule_directory.stat.isdir | default(false)
    - dummy_ferm_variable_directory.stat.isdir | default(false)
  notify:
    - dummy restart ferm

- name: configure ferm isolation for dummy{{ dummy_index }}
  ansible.builtin.template:
    src: ferm.j2
    dest: "/etc/ferm/ferm.d/9000-dummy{{ dummy_index }}-isolation.conf"
    owner: root
    group: root
    mode: "0600"
  when:
    - dummy_ferm_rule_directory.stat.isdir | default(false)
    - dummy_ferm_variable_directory.stat.isdir | default(false)
  notify:
    - dummy restart ferm
